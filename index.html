<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ring</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-title" content="Ring">
<style>
:root{--bg:#0b0b0d;--work:#ff3b30;--rest:#30d158;--fg:#fff;--muted:#8e8e93;--card:#1c1c1e;--accent:var(--work);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
body.rest{--accent:var(--rest)}
.view{height:100%;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:6vh 24px 8vh}
.view.on{display:flex}

/* Réglages */
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.05em}
.rows{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.row{background:var(--card);border-radius:18px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between}
.lbl{font-size:17px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{min-width:70px;text-align:center;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stepper button{width:46px;height:46px;font-size:26px;background:#2c2c2e}
.total{color:var(--muted);font-size:16px;text-align:center}

/* Chrono */
.phase{font-size:22px;font-weight:700;letter-spacing:.2em;color:var(--accent);text-align:center}
.round{font-size:18px;color:var(--muted);margin-top:8px;text-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap;max-width:300px}
.dot{width:10px;height:10px;border-radius:50%;background:#333}
.dot.done{background:var(--work)}
.dot.cur{background:var(--fg)}
.time{font-size:min(30vw,130px);font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.time.warn{color:var(--accent)}
.bottom{display:flex;flex-direction:column;align-items:center;gap:18px;min-height:150px;justify-content:flex-end}
.link{background:none;border:0;color:var(--muted);font-size:17px;width:auto;height:auto;padding:8px 14px;border-radius:10px;visibility:hidden}
.link.show{visibility:visible}

button{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
button:active{transform:scale(.94)}
button.start{width:100%;max-width:420px;height:64px;border-radius:18px;font-size:20px;font-weight:700;letter-spacing:.05em}

.tlink{background:none;border:0;color:var(--muted);font-size:17px;width:auto;height:auto;padding:8px 14px;border-radius:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.modal.on{display:flex}
.box{background:var(--card);border-radius:22px;padding:26px 22px;width:100%;max-width:360px;text-align:center}
.box h2{margin:0 0 8px;font-size:22px}
.box p{margin:0 0 22px;color:var(--muted);font-size:16px}
.btns{display:flex;flex-direction:column;gap:10px;width:100%}
button.pill{width:100%;height:54px;border-radius:14px;font-size:18px;font-weight:600;background:#2c2c2e}
button.pill.danger{background:var(--work)}
#hist{justify-content:flex-start;gap:14px;overflow-y:auto}
.hlist{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;flex:1}
.hitem{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hitem small{color:var(--muted);display:block;font-size:14px;margin-top:2px}
.hitem b{font-size:17px}
.empty{color:var(--muted);text-align:center;margin-top:30px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-30px);background:var(--rest);color:#000;font-weight:600;padding:12px 20px;border-radius:14px;opacity:0;transition:.3s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="view on" id="setup">
  <h1>🥊 SPARRING</h1>
  <div class="rows">
    <div class="row"><span class="lbl">Rounds</span>
      <div class="stepper"><button data-k="rounds" data-d="-1">−</button><b id="v-rounds"></b><button data-k="rounds" data-d="1">+</button></div></div>
    <div class="row"><span class="lbl">Sparring</span>
      <div class="stepper"><button data-k="work" data-d="-15">−</button><b id="v-work"></b><button data-k="work" data-d="15">+</button></div></div>
    <div class="row"><span class="lbl">Repos</span>
      <div class="stepper"><button data-k="rest" data-d="-5">−</button><b id="v-rest"></b><button data-k="rest" data-d="5">+</button></div></div>
  </div>
  <div class="total" id="total"></div>
  <div style="width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:8px">
    <button class="start" id="start">DÉMARRER</button>
    <button class="tlink" id="histBtn">Historique</button>
  </div>
</div>

<div class="view" id="run">
  <div>
    <div class="phase" id="phase">COMBAT</div>
    <div class="round" id="round"></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="time" id="time">2:00</div>
  <div class="bottom">
    <button id="btn" aria-label="Lecture / Pause">▶</button>
    <button class="link" id="back">Corner</button>
  </div>
</div>

<div class="view" id="hist">
  <h1>HISTORIQUE</h1>
  <div class="total" id="hsum"></div>
  <div class="hlist" id="hlist"></div>
  <div class="btns" style="max-width:420px;align-items:center">
    <button class="pill" id="hback">Retour</button>
    <button class="tlink" id="hclear">Effacer l'historique</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2>Arrêter l'entraînement ?</h2>
    <p>Si oui, la séance est enregistrée avec la date, le temps de combat et les rounds faits.</p>
    <div class="btns">
      <button class="pill danger" id="yes">Oui, terminer</button>
      <button class="pill" id="no">Non, rester en pause</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* Icône écran d'accueil : gant de boxe 🥊 */
(function(){try{
  const c=document.createElement('canvas'); c.width=c.height=180;
  const x=c.getContext('2d');
  x.fillStyle='#0b0b0d'; x.fillRect(0,0,180,180);
  x.font='110px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText('\u{1F94A}',90,98);
  const url=c.toDataURL('image/png');
  ['apple-touch-icon','icon'].forEach(rel=>{
    const l=document.createElement('link'); l.rel=rel; l.href=url; document.head.appendChild(l);
  });
}catch(e){}})();
</script>

<script>
/* Anti-zoom : pas de zoom au double-tap ni au pincement */
['gesturestart','gesturechange','gestureend','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
</script>
